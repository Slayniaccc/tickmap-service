spring.application.name=tickmap-service

# --- Database -------------------------------------------------------------
# File-based H2 so the last good data survives a restart while the upstream API is down.
spring.datasource.url=jdbc:h2:file:./data/tickmap;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.h2.console.enabled=true

# --- Web ------------------------------------------------------------------
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=200

# --- Upstream API & ingestion ---------------------------------------------
tickmap.upstream.base-url=https://dev-task.elancoapps.com/data
tickmap.upstream.connect-timeout=5s
tickmap.upstream.read-timeout=15s
tickmap.upstream.retry.max-attempts=4
tickmap.upstream.retry.initial-backoff=1s
tickmap.upstream.retry.multiplier=2.0
tickmap.upstream.retry.max-backoff=30s

tickmap.ingestion.enabled=true
tickmap.ingestion.chunk-size=500
# Runs once at startup (after initial-delay), then every refresh-interval.
tickmap.ingestion.initial-delay=PT2S
tickmap.ingestion.refresh-interval=PT6H

# --- Docs & ops -----------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info

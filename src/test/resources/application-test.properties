# Unique per Spring context so cached test contexts never share a database.
spring.datasource.url=jdbc:h2:mem:tickmap-${random.uuid};DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

# Never call the real upstream API from tests.
tickmap.ingestion.enabled=false
tickmap.upstream.base-url=http://localhost:0/unused
